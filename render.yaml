services:
  - type: web
    name: axonyx-site-ui
    runtime: rust
    plan: free
    buildCommand: cargo install cargo-axonyx --version 0.6.14 --locked --force && cargo ax build --clean --compiled
    startCommand: cargo ax run start --compiled --host 0.0.0.0 --port $PORT
    healthCheckPath: /__axonyx/health
