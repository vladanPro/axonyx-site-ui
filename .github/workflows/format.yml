name: Axonyx Source Format

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: asx-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Immutable formatter source until this behavior is released to crates.io.
      - run: cargo install cargo-axonyx --git https://github.com/vladanPro/axonyx-framework --rev 79c58a2968307b4fd4301c33b31b751d6e94b823 --force
      - run: cargo ax fmt --check
      - name: Check staged-source hook safety
        shell: pwsh
        run: ./scripts/test-format-hook.ps1 -FormatterPath (Get-Command cargo-ax).Source
